  args:
    user: synapse_user
    password: "YourSuperSecurePassword123!"
    database: synapse
    host: db
    cp_min: 5
    cp_max: 10
log_config: "/data/192.168.0.1.log.config"
media_store_path: /data/media_store
registration_shared_secret: "c@klh6U.1e#Tru^C2aAd-8Ejjoi8ZP^7&#C5SR5*p57umWk+hx"
report_stats: false
macaroon_secret_key: "PpW*XosKvm;5VKXLqLQ+no&s76Q;h^~rg^eVkM-;Lxl*CYzI0l"
form_secret: "-,0wqX&5r:IbVD;8SbJcntYow+485JN1A*cbJJaAZan:21XfQj"
signing_key_path: "/data/192.168.0.1.signing.key"
